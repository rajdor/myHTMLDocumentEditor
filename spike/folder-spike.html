<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Folder access spike</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:860px;margin:2rem auto;padding:0 1rem}button{font:inherit;padding:.4rem .8rem;margin:.2rem .4rem .2rem 0}pre{background:#f4f4f4;padding:1rem;white-space:pre-wrap;border-radius:6px;min-height:8rem}</style>
</head><body>
<h1>Folder access spike</h1>
<p>Throwaway test page. It reads file names and sizes, and writes then removes one small test file in the folder you pick.</p>
<button id="pick">1. Pick folder</button><button id="re">2. Reconnect remembered folder</button><button id="forget">Forget folder</button><button id="copy">Copy results</button>
<pre id="out"></pre>
<script>
'use strict';
const out = document.getElementById('out');
const log = (s) => { out.textContent += s + '\n'; };
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('folder-spike', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const kv = async (mode, fn) => { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('kv', mode); const q = fn(t.objectStore('kv')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
async function walk(dir, depth, st) {
  for await (const [name, h] of dir.entries()) {
    if (st.files + st.dirs >= 2000) { st.capped = true; return; }
    if (h.kind === 'directory') { st.dirs++; if (name !== '.git' && name !== 'node_modules' && depth < 6) await walk(h, depth + 1, st); }
    else { st.files++; try { const f = await h.getFile(); st.bytes += f.size; if (f.size === 0) st.zero++; } catch (e) { st.errors++; st.lastError = name + ': ' + e.name; } }
  }
}
async function report(h) {
  log('Folder: ' + h.name);
  const st = { files: 0, dirs: 0, bytes: 0, zero: 0, errors: 0, capped: false, lastError: '' };
  const t0 = performance.now();
  try { await walk(h, 0, st); } catch (e) { log('Walk failed: ' + e.name + ' ' + e.message); }
  log('Walk: ' + st.files + ' files, ' + st.dirs + ' folders, ' + (st.bytes / 1048576).toFixed(1) + ' MB, ' + Math.round(performance.now() - t0) + ' ms' + (st.capped ? ' (stopped at 2000 entries)' : ''));
  log('Size read errors: ' + st.errors + (st.lastError ? ' (last: ' + st.lastError + ')' : '') + '; zero-size files: ' + st.zero);
  try {
    const fh = await h.getFileHandle('.spike-test.txt', { create: true });
    const w = await fh.createWritable(); await w.write('spike ' + Date.now()); await w.close();
    const back = await (await fh.getFile()).text();
    log('Write and read back: ' + (back.startsWith('spike ') ? 'ok' : 'MISMATCH'));
    let nm = '.spike-test.txt';
    if (fh.move) { try { await fh.move('.spike-test-renamed.txt'); nm = '.spike-test-renamed.txt'; log('Rename with move(): ok'); } catch (e) { log('Rename with move(): failed, ' + e.name + ' ' + e.message); } } else log('Rename with move(): not available');
    await h.removeEntry(nm); log('Remove test file: ok');
  } catch (e) { log('Write test failed: ' + e.name + ' ' + e.message); }
  log('Done.');
}
async function start() {
  log('Page: ' + location.protocol + ' | ' + navigator.userAgent);
  log('showDirectoryPicker: ' + ('showDirectoryPicker' in window) + ' | secure context: ' + isSecureContext);
  try {
    const h = await kv('readonly', s => s.get('dir'));
    if (!h) { log('Remembered folder: none. Press 1.'); return; }
    const p = await h.queryPermission({ mode: 'readwrite' });
    log('Remembered folder: ' + h.name + ' | permission on load: ' + p);
    if (p === 'granted') await report(h); else log('Press 2 to reconnect.');
  } catch (e) { log('Remembered folder check failed: ' + e.name + ' ' + e.message); }
}
document.getElementById('pick').onclick = async () => { try { const h = await showDirectoryPicker({ mode: 'readwrite' }); try { await kv('readwrite', s => s.put(h, 'dir')); log('Stored folder handle: ok'); } catch (e) { log('Storing folder handle failed: ' + e.name + ' ' + e.message); } await report(h); } catch (e) { log('Pick failed: ' + e.name + ' ' + e.message); } };
document.getElementById('re').onclick = async () => { try { const h = await kv('readonly', s => s.get('dir')); if (!h) return log('Nothing remembered.'); const p = await h.requestPermission({ mode: 'readwrite' }); log('Permission after reconnect: ' + p); if (p === 'granted') await report(h); } catch (e) { log('Reconnect failed: ' + e.name + ' ' + e.message); } };
document.getElementById('forget').onclick = async () => { await kv('readwrite', s => s.delete('dir')); log('Forgotten.'); };
document.getElementById('copy').onclick = () => navigator.clipboard.writeText(out.textContent);
start();
</script>
</body></html>
